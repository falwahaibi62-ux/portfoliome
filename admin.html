<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<style>
body{margin:0;background:#F7F5FC}
a{color:#6B4FD8;text-decoration:none}a:hover{color:#1C1633}
input,textarea,select{font-family:inherit}
</style>
<style>#app{min-height:100vh}</style>
<meta name="robots" content="noindex, nofollow">
<script>window.QM_REQUIRE_LOGIN = true;</script>
<script src="config.js"></script>
<script src="qm-store.js"></script>
<script src="qm-dc.js"></script>
</head>
<body>
<style>
  [hidden]{display:none!important}
  .qm-login{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(60% 50% at 80% 10%,rgba(240,139,216,.18),transparent 70%),radial-gradient(55% 55% at 10% 90%,rgba(143,184,255,.2),transparent 70%),#F7F5FC;font-family:'Tajawal',Tahoma,sans-serif;color:#1C1633}
  .qm-card{width:100%;max-width:400px;background:#fff;border:1px solid #E6E1F5;border-radius:28px;padding:30px;display:grid;gap:14px;box-shadow:0 24px 60px -28px rgba(107,79,216,.45)}
  .qm-card h1{margin:0;font-size:24px;font-weight:900}
  .qm-card p{margin:0;color:#4A4560;font-size:14px;line-height:1.7}
  .qm-card label{display:grid;gap:6px;font-size:13px;font-weight:700}
  .qm-card input{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid #D8D1EE;background:#FBFAFE;font:inherit;font-size:15px;color:#1C1633}
  .qm-card input:focus{outline:3px solid #B8B2FF;outline-offset:1px}
  .qm-btn{min-height:48px;border:0;border-radius:999px;background:#1C1633;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
  .qm-btn:disabled{opacity:.6}
  .qm-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .qm-brand{display:flex;align-items:center;gap:10px}
  .qm-lang{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #E6E1F5;background:#fff;color:#1C1633;font:inherit;font-weight:600;cursor:pointer}
  .qm-link{background:none;border:0;padding:0;color:#6B4FD8;font:inherit;font-size:14px;cursor:pointer;justify-self:start;text-decoration:underline}
  .qm-msg{min-height:1.2em;font-size:14px;color:#A3165B}
  .qm-msg.ok{color:#1F7F6C}
  .qm-help{font-size:13.5px;color:#4A4560;line-height:1.8}
  .qm-help summary{cursor:pointer;font-weight:700;color:#6B4FD8}
  .qm-help ol{margin:8px 0;padding-inline-start:20px}
  .qm-out{position:fixed;inset-block-end:18px;inset-inline-start:18px;z-index:20;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid #E6E1F5;background:#fff;color:#1C1633;font-family:'Tajawal',Tahoma,sans-serif;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 24px -12px rgba(28,22,51,.35)}
</style>
<div class="qm-login" id="qmLogin" dir="rtl" lang="ar">
  <form class="qm-card" id="qmLoginForm" novalidate>
    <div class="qm-top">
      <div class="qm-brand">
        <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="qlg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FB8FF"/><stop offset="0.5" stop-color="#B8B2FF"/><stop offset="1" stop-color="#F08BD8"/></linearGradient></defs><path d="M86 56V32A20 20 0 0 0 66 12H32A20 20 0 0 0 12 32V68A20 20 0 0 0 32 88H56" fill="none" stroke="url(#qlg)" stroke-width="13" stroke-linecap="round"/><path d="M61 61L72 72" stroke="url(#qlg)" stroke-width="12" stroke-linecap="round"/><rect x="72" y="72" width="22" height="22" rx="6" fill="url(#qlg)"/></svg>
        <h1 data-l="title"></h1>
      </div>
      <button type="button" class="qm-lang" id="qmLang"></button>
    </div>
    <p data-l="sub"></p>
    <label><span data-l="token"></span><input type="password" id="qmToken" autocomplete="off" dir="ltr" placeholder="github_pat_…" required></label>
    <button class="qm-btn" type="submit" id="qmGo" data-l="login"></button>
    <span class="qm-msg" id="qmMsg" role="alert"></span>
    <details class="qm-help"><summary data-l="howT"></summary><ol><li data-l="how1"></li><li data-l="how2"></li><li data-l="how3"></li><li data-l="how4"></li></ol><a id="qmNewTok" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" data-l="howLink"></a></details>
  </form>
</div>

<div id="app" hidden></div>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      lang: 'ar', db: null, dbChecked: false, projects: [], contacts: [], contactsLoaded: false, stats: { completed: '', inProgress: '', study: '' },
      form: this.emptyForm(), editId: null, pendingDelete: null, msg: '', msgKind: 'ok'
    };
    this.unsubs = [];
  }
  emptyForm() {
    return { titleAr: '', titleEn: '', subAr: '', subEn: '', problemAr: '', problemEn: '', solutionAr: '', solutionEn: '', resultAr: '', resultEn: '', tagsAr: '', tagsEn: '', order: '', image: '', year: '2026', link: '', status: 'done', visible: true };
  }
  componentDidMount() {
    let tries = 0;
    const getDb = () => {
      const c = window.claude;
      if (c && typeof c.use === 'function') return c.use('db');
      if (++tries > 40) return Promise.resolve(null);
      return new Promise((r) => setTimeout(r, 250)).then(getDb);
    };
    getDb().then((db) => {
      if (this.dead) return;
      this.setState({ db, dbChecked: true });
      if (!db) return;
      this.unsubs.push(db.collection('projects').orderBy('order').onSnapshot(
        (snap) => this.setState({ projects: snap.docs.map((d) => Object.assign({ id: d.id }, d.data())) }),
        () => {}
      ));
      db.doc('settings/stats').get().then((snap) => {
        const d = snap.exists ? snap.data() : {};
        const v = (x) => (typeof x === 'number' ? String(x) : '');
        this.setState({ stats: { completed: v(d.completed), inProgress: v(d.inProgress), study: v(d.study) } });
      }).catch(() => {});
      db.doc('settings/contact').get().then((snap) => {
        const d = snap.exists ? snap.data() : null;
        const items = d && Array.isArray(d.items) ? d.items : [];
        this.setState({ contacts: items.map((it, i) => ({ key: 'k' + i + '-' + Date.now(), type: it.type || 'email', value: it.value || '', enabled: it.enabled !== false })), contactsLoaded: true });
      }).catch(() => this.setState({ contactsLoaded: true }));
    }).catch(() => this.setState({ dbChecked: true }));
  }
  componentWillUnmount() {
    this.dead = true;
    this.unsubs.forEach((u) => { try { u(); } catch (e) {} });
  }
  flash(msg, kind) {
    this.setState({ msg, msgKind: kind || 'ok' });
    clearTimeout(this.msgTimer);
    this.msgTimer = setTimeout(() => { if (!this.dead) this.setState({ msg: '' }); }, 5000);
  }
  failMsg(t, e) {
    const code = e && e.code;
    if (code === 'invalid_argument') return t.noPermission;
    if (code === 'quota_exceeded') return t.quota;
    return t.saveError;
  }
  renderVals() {
    const lang = this.state.lang;
    const ar = {
      title: 'لوحة التحكم', subtitle: 'قريب مني · إدارة البورتفوليو', viewSite: 'عرض البورتفوليو', switchTo: 'English',
      projects: 'الإنجازات', orderHint: 'الإنجاز صاحب أصغر رقم ترتيب يظهر كدراسة حالة رئيسية، والباقي يظهر كبطاقات تحته.',
      empty: 'لا توجد إنجازات بعد. البورتفوليو يعرض حالياً المحتوى التجريبي.', addProject: 'إضافة إنجاز',
      edit: 'تعديل', del: 'حذف', confirmDel: 'تأكيد الحذف', newTitle: 'إنجاز جديد', editTitle: 'تعديل الإنجاز',
      add: 'إضافة', update: 'حفظ التعديلات', cancel: 'إلغاء', count: (n) => n + ' إنجاز', orderWord: 'الترتيب',
      f: { titleAr: 'اسم المشروع (عربي)', titleEn: 'اسم المشروع (English)', subAr: 'وصف قصير (عربي)', subEn: 'وصف قصير (English)', problemAr: 'المشكلة (عربي)', problemEn: 'المشكلة (English)', solutionAr: 'الحل (عربي)', solutionEn: 'الحل (English)', resultAr: 'النتيجة (عربي)', resultEn: 'النتيجة (English)', tagsAr: 'الوسوم (عربي، افصلي بفاصلة)', tagsEn: 'الوسوم (English, comma-separated)', order: 'الترتيب' },
      statsTitle: 'أرقام المشاريع', statsHint: 'تظهر في أعلى البورتفوليو بجانب سنوات الخبرة.', saveStats: 'حفظ الأرقام', sCompleted: 'مشاريع منجزة', sProgress: 'قيد التنفيذ', sStudy: 'تحت الدراسة',
      contacts: 'وسائل التواصل', contactHint: 'تظهر في قسم "تواصل معنا" بالترتيب نفسه. الأولى تظهر كزر رئيسي.',
      type: 'الوسيلة', value: 'القيمة', show: 'إظهار', remove: 'إزالة', addContact: 'إضافة وسيلة', saveContacts: 'حفظ وسائل التواصل',
      types: { whatsapp: 'واتساب', instagram: 'إنستغرام', email: 'البريد الإلكتروني', linkedin: 'LinkedIn', x: 'X (تويتر)', phone: 'هاتف' },
      saved: 'تم الحفظ، والبورتفوليو تحدّث.', deleted: 'تم الحذف.', needTitle: 'اكتبي اسم المشروع بلغة واحدة على الأقل.',
      saveError: 'تعذّر الحفظ. حاولي مرة أخرى.', noPermission: 'ليس لديك صلاحية التعديل على هذه الصفحة.', quota: 'وصلتِ للحد الأقصى من البيانات المخزنة.',
      image: 'صورة المشروع', status: 'حالة المشروع', year: 'السنة', link: 'رابط المشروع (اختياري)', visible: 'إظهار في الموقع', st: { done: ['منجز', 'مشروع مكتمل ومسلّم'], progress: ['قيد التنفيذ', 'العمل جارٍ عليه الآن'], study: ['تحت الدراسة', 'فكرة أو دراسة قبل البدء'] }, pickImg: 'اختيار صورة', changeImg: 'تغيير الصورة', uploading: 'جارٍ الرفع…', imgFail: 'تعذّر رفع الصورة.',
      noDb: 'التخزين غير متاح في هذا العرض، فلن تُحفظ التعديلات. افتحي الصفحة من رابطها في Claude.'
    };
    const en = {
      title: 'Admin', subtitle: 'Qareeb Minni · Portfolio management', viewSite: 'View portfolio', switchTo: 'العربية',
      projects: 'Achievements', orderHint: 'The achievement with the lowest order number shows as the main case study; the rest show as cards below it.',
      empty: 'No achievements yet. The portfolio is showing sample content.', addProject: 'Add achievement',
      edit: 'Edit', del: 'Delete', confirmDel: 'Confirm delete', newTitle: 'New achievement', editTitle: 'Edit achievement',
      add: 'Add', update: 'Save changes', cancel: 'Cancel', count: (n) => n + (n === 1 ? ' achievement' : ' achievements'), orderWord: 'Order',
      f: { titleAr: 'Project name (Arabic)', titleEn: 'Project name (English)', subAr: 'Short description (Arabic)', subEn: 'Short description (English)', problemAr: 'Problem (Arabic)', problemEn: 'Problem (English)', solutionAr: 'Solution (Arabic)', solutionEn: 'Solution (English)', resultAr: 'Result (Arabic)', resultEn: 'Result (English)', tagsAr: 'Tags (Arabic, comma-separated)', tagsEn: 'Tags (English, comma-separated)', order: 'Order' },
      statsTitle: 'Project numbers', statsHint: 'Shown at the top of the portfolio next to years of experience.', saveStats: 'Save numbers', sCompleted: 'Completed projects', sProgress: 'In progress', sStudy: 'Under study',
      contacts: 'Contact methods', contactHint: 'Shown in the "Contact us" section in this order. The first one shows as the main button.',
      type: 'Method', value: 'Value', show: 'Show', remove: 'Remove', addContact: 'Add method', saveContacts: 'Save contact methods',
      types: { whatsapp: 'WhatsApp', instagram: 'Instagram', email: 'Email', linkedin: 'LinkedIn', x: 'X (Twitter)', phone: 'Phone' },
      saved: 'Saved. The portfolio is updated.', deleted: 'Deleted.', needTitle: 'Enter the project name in at least one language.',
      saveError: 'Could not save. Please try again.', noPermission: 'You do not have permission to edit this page.', quota: 'The storage limit has been reached.',
      image: 'Project image', status: 'Project status', year: 'Year', link: 'Project link (optional)', visible: 'Show on the site', st: { done: ['Completed', 'Finished and delivered'], progress: ['In progress', 'Being worked on now'], study: ['Under study', 'An idea or pre-start study'] }, pickImg: 'Choose image', changeImg: 'Change image', uploading: 'Uploading…', imgFail: 'Image upload failed.',
      noDb: 'Storage is not available in this view, so changes will not be saved. Open the page from its Claude link.'
    };
    const t = lang === 'ar' ? ar : en;
    const db = this.state.db;
    const form = this.state.form;
    const editing = !!this.state.editId;

    const placeholders = { whatsapp: '+968 9xxxxxxx', instagram: '@qareebminni', email: 'name@example.com', linkedin: 'https://www.linkedin.com/in/...', x: '@qareebminni', phone: '+968 2xxxxxxx' };
    const multiKeys = ['problemAr', 'problemEn', 'solutionAr', 'solutionEn', 'resultAr', 'resultEn'];
    const fieldKeys = ['titleAr', 'titleEn', 'subAr', 'subEn', 'problemAr', 'problemEn', 'solutionAr', 'solutionEn', 'resultAr', 'resultEn', 'tagsAr', 'tagsEn', 'order'];
    const fields = fieldKeys.map((k) => {
      const multi = multiKeys.indexOf(k) >= 0;
      return {
        key: k, label: t.f[k], value: form[k], multi, single: !multi,
        type: k === 'order' ? 'number' : 'text',
        dir: k === 'order' ? 'ltr' : (k.slice(-2) === 'Ar' ? 'rtl' : 'ltr'),
        placeholder: '',
        wrapStyle: 'display: flex; flex-direction: column; gap: 6px',
        onInput: (e) => { const v = e.target.value; this.setState({ form: Object.assign({}, this.state.form, { [k]: v }) }); }
      };
    });

    const projectRows = this.state.projects.map((p) => {
      const pending = this.state.pendingDelete === p.id;
      const active = this.state.editId === p.id;
      return {
        title: (lang === 'ar' ? (p.titleAr || p.titleEn) : (p.titleEn || p.titleAr)) || '—',
        meta: t.orderWord + ': ' + (p.order === undefined || p.order === null ? '—' : p.order),
        style: 'display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid ' + (active ? '#6B4FD8' : '#EEEAF7') + '; background: ' + (active ? '#F3F0FF' : '#FBFAFE'),
        delLabel: pending ? t.confirmDel : t.del,
        delStyle: 'min-height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; ' + (pending ? 'border: none; background: #A3165B; color: #FFFFFF' : 'border: 1px solid #F2C4D8; background: #FFFFFF; color: #A3165B'),
        edit: () => {
          const f = this.emptyForm();
          Object.keys(f).forEach((k) => { if (k === 'visible') f[k] = p[k] !== false; else if (p[k] !== undefined && p[k] !== null) f[k] = String(p[k]); });
          this.setState({ form: f, editId: p.id, pendingDelete: null });
        },
        remove: () => {
          if (!pending) { this.setState({ pendingDelete: p.id }); return; }
          if (!db) return;
          db.doc('projects/' + p.id).delete().then(() => {
            if (this.state.editId === p.id) this.setState({ form: this.emptyForm(), editId: null });
            this.setState({ pendingDelete: null });
            this.flash(t.deleted, 'ok');
          }).catch((e) => this.flash(this.failMsg(t, e), 'err'));
        }
      };
    });

    const saveProject = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      const f = this.state.form;
      if (!String(f.titleAr).trim() && !String(f.titleEn).trim()) { this.flash(t.needTitle, 'err'); return; }
      if (!db) { this.flash(t.noDb, 'err'); return; }
      const body = {};
      Object.keys(f).forEach((k) => { if (['order', 'image', 'visible'].indexOf(k) < 0) body[k] = String(f[k]).trim(); });
      const n = parseFloat(f.order);
      const maxOrder = this.state.projects.reduce((m, p) => Math.max(m, typeof p.order === 'number' ? p.order : 0), 0);
      body.order = isFinite(n) ? n : maxOrder + 1;
      body.image = f.image || '';
      body.visible = f.visible !== false;
      body.updatedAt = new Date().toISOString();
      const ref = this.state.editId ? db.doc('projects/' + this.state.editId) : db.collection('projects').doc();
      ref.set(body).then(() => {
        this.setState({ form: this.emptyForm(), editId: null });
        this.flash(t.saved, 'ok');
      }).catch((err) => this.flash(this.failMsg(t, err), 'err'));
    };

    const typeOptions = ['whatsapp', 'instagram', 'email', 'linkedin', 'x', 'phone'].map((v) => ({ value: v, label: t.types[v] }));
    const setContact = (key, patch) => this.setState({ contacts: this.state.contacts.map((c) => (c.key === key ? Object.assign({}, c, patch) : c)) });
    const contactRows = this.state.contacts.map((c) => ({
      type: c.type, value: c.value, enabled: c.enabled, placeholder: placeholders[c.type] || '',
      onType: (e) => setContact(c.key, { type: e.target.value }),
      onValue: (e) => setContact(c.key, { value: e.target.value }),
      onToggle: (e) => setContact(c.key, { enabled: !!e.target.checked }),
      onRemove: () => this.setState({ contacts: this.state.contacts.filter((x) => x.key !== c.key) })
    }));
    const addContact = () => this.setState({ contacts: this.state.contacts.concat([{ key: 'n' + Date.now(), type: 'whatsapp', value: '', enabled: true }]) });
    const saveContacts = () => {
      if (!db) { this.flash(t.noDb, 'err'); return; }
      const items = this.state.contacts
        .map((c) => ({ type: c.type, value: String(c.value).trim(), enabled: !!c.enabled }))
        .filter((c) => c.value);
      db.doc('settings/contact').set({ items, updatedAt: new Date().toISOString() })
        .then(() => this.flash(t.saved, 'ok'))
        .catch((err) => this.flash(this.failMsg(t, err), 'err'));
    };

    const statFields = [['completed', t.sCompleted], ['inProgress', t.sProgress], ['study', t.sStudy]].map(([k, label]) => ({
      label, value: this.state.stats[k],
      onInput: (e) => { const v = e.target.value; this.setState({ stats: Object.assign({}, this.state.stats, { [k]: v }) }); }
    }));
    const saveStats = () => {
      if (!db) { this.flash(t.noDb, 'err'); return; }
      const n = (v) => { const x = parseInt(v, 10); return isFinite(x) && x >= 0 ? x : 0; };
      const st = this.state.stats;
      db.doc('settings/stats').set({ completed: n(st.completed), inProgress: n(st.inProgress), study: n(st.study), updatedAt: new Date().toISOString() })
        .then(() => this.flash(t.saved, 'ok'))
        .catch((err) => this.flash(this.failMsg(t, err), 'err'));
    };

    const msgKind = this.state.msgKind;
    return {
      lang, t, fields, projectRows, contactRows, typeOptions, editing,
      dir: lang === 'ar' ? 'rtl' : 'ltr',
      noDb: this.state.dbChecked && !db,
      noProjects: this.state.projects.length === 0,
      projectCount: t.count(this.state.projects.length),
      formTitle: editing ? t.editTitle : t.newTitle,
      saveLabel: editing ? t.update : t.add,
      hasMsg: !!this.state.msg,
      msg: this.state.msg,
      msgStyle: 'padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; ' + (msgKind === 'err' ? 'background: #FDECF3; border: 1px solid #F2C4D8; color: #A3165B' : 'background: #ECFAF3; border: 1px solid #B6E5CC; color: #11663D'),
      toggleLang: () => this.setState({ lang: lang === 'ar' ? 'en' : 'ar' }),
      newProject: () => this.setState({ form: this.emptyForm(), editId: null, pendingDelete: null }),
      statusCards: ['done', 'progress', 'study'].map((k) => ({ label: t.st[k][0], hint: t.st[k][1], pick: () => this.setState({ form: Object.assign({}, this.state.form, { status: k }) }),
        style: 'display: flex; flex-direction: column; gap: 2px; text-align: start; padding: 12px 14px; border-radius: 16px; cursor: pointer; font-family: inherit; color: #1C1633; border: 2px solid ' + (form.status === k ? '#6B4FD8' : '#E6E1F5') + '; background: ' + (form.status === k ? '#F3F0FF' : '#FFFFFF') })),
      yearVal: form.year, linkVal: form.link, visibleVal: form.visible !== false,
      setYear: (e) => { const v = e.target.value; this.setState({ form: Object.assign({}, this.state.form, { year: v }) }); },
      setLink: (e) => { const v = e.target.value; this.setState({ form: Object.assign({}, this.state.form, { link: v }) }); },
      setVisible: (e) => { const v = !!e.target.checked; this.setState({ form: Object.assign({}, this.state.form, { visible: v }) }); },
      hasImage: !!form.image, imageSrc: form.image ? QM.img(form.image) : '',
      imageLabel: this.state.uploading ? t.uploading : (form.image ? t.changeImg : t.pickImg),
      pickImage: (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        this.setState({ uploading: true });
        window.claude.use('assets').then((as) => {
          if (!as) throw new Error('na');
          return as.upload(file);
        }).then((r) => this.setState({ uploading: false, form: Object.assign({}, this.state.form, { image: r.id }) }))
          .catch(() => { this.setState({ uploading: false }); this.flash(t.imgFail, 'err'); });
      },
      saveProject, addContact, saveContacts, statFields, saveStats
    };

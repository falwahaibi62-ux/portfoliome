.shot{transition:transform .8s cubic-bezier(.22,1,.36,1)}
.card3d:hover .shot{transform:scale(1.015)}
.bar3d{position:relative;background:#B8B2FF}
.bar3d::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;background:#D6D2FF;transform:skewX(-45deg);transform-origin:bottom left}
.bar3d::after{content:"";position:absolute;top:0;right:-8px;width:8px;height:100%;background:#8F86E8;transform:skewY(-45deg);transform-origin:top left}
@property --k{syntax:'<number>';inherits:false;initial-value:0.12}
.layer3d{animation:qmRise 20s ease-in-out infinite;animation-delay:calc(var(--i) * 0.7s);transition:none}

.orbit3d{animation:qmOrbit 20s ease-in-out infinite}
@keyframes qmOrbit{0%,100%{rotate:0 1 0 -9deg}50%{rotate:0 1 0 9deg}}
.step3d{transition:transform .35s ease, box-shadow .35s ease, background .35s ease}
@media (prefers-reduced-motion: reduce){.float3d,.orbit3d{animation:none}.layer3d{animation:none;--k:1;opacity:1}.step3d,.card3d{transition:none}}
[dir=rtl] .arw{transform:scaleX(-1)}
.prec-desk{display:none}.prec-mob{display:flex}
@media (min-width:640px){.prec-desk{display:block}.prec-mob{display:none}}

    super(props);

    this.unsubs = [];

  componentDidMount() {
    let tries = 0;
    const getDb = () => {
      const c = window.claude;
      if (c && typeof c.use === 'function') return c.use('db');
      if (++tries > 40) return Promise.resolve(null);
      return new Promise((r) => setTimeout(r, 250)).then(getDb);
    };
    getDb().then((db) => {
      if (!db || this.dead) return;
      this.unsubs.push(db.collection('projects').orderBy('order').onSnapshot(
        (snap) => this.setState({ projects: snap.docs.map((d) => Object.assign({ id: d.id }, d.data())) }),
        () => {}
      ));
      this.unsubs.push(db.doc('settings/stats').onSnapshot(
        (snap) => this.setState({ statsDoc: snap.exists ? snap.data() : null }),
        () => {}
      ));
      this.unsubs.push(db.doc('settings/contact').onSnapshot(
        (snap) => { const d = snap.exists ? snap.data() : null; this.setState({ contactItems: d && Array.isArray(d.items) ? d.items : [] }); },
        () => {}
      ));
    }).catch(() => {});
  }
  componentWillUnmount() {
    this.dead = true;
    this.unsubs.forEach((u) => { try { u(); } catch (e) {} });
  }

      case 'whatsapp': { const d = v.replace(/\D/g, ''); return d ? { href: 'https://wa.me/' + d, label: L('واتساب', 'WhatsApp'), isWa: true } : null; }
      case 'instagram': return handle ? { href: 'https://instagram.com/' + handle, label: '@' + handle, isIg: true } : null;
      case 'email': return /^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(v) ? { href: 'mailto:' + v, label: v, isEmail: true } : null;
      case 'linkedin': {
        const ok = /^https:\/\/(www\.)?linkedin\.com\/[A-Za-z0-9\-_/%.]+$/.test(v);
        const slug = v.replace(/[^A-Za-z0-9\-_]/g, '');
        if (!ok && !slug) return null;
        return { href: ok ? v : 'https://www.linkedin.com/in/' + slug, label: 'LinkedIn', isLi: true };
      }
      case 'x': return handle ? { href: 'https://x.com/' + handle, label: '@' + handle, isX: true } : null;
      case 'phone': { const p = v.replace(/[^\d+]/g, ''); return p ? { href: 'tel:' + p, label: v, isPhone: true } : null; }
      default: return null;
    }
